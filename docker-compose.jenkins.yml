# ============================================================
# SRE 运维学习平台 — Jenkins 容器化部署（Linux 版）
# 用途：在 Linux 上用 Docker 运行 Jenkins，打通 Docker-in-Docker
# 使用: docker compose -f ci-cd-tutorial/linux/docker-compose.jenkins.yml up -d
# ============================================================

version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    restart: unless-stopped

    # ==== DinD 权限配置 ====
    privileged: true        # 特权模式：访问 Docker 守护进程需要
    user: root              # root 用户：避免 docker.sock 权限拒绝

    ports:
      - "8080:8080"         # Web UI（Nginx 反代后可不对外暴露）
      - "50000:50000"       # Agent 通信端口（多节点构建需要）

    volumes:
      # Jenkins 数据持久化到宿主机的 /opt/docker-data/jenkins-home
      # Linux 下需要: chown 1000:1000 /opt/docker-data/jenkins-home
      - /opt/docker-data/jenkins-home:/var/jenkins_home

      # ==== DinD 核心：挂载宿主机 Docker 环境 ====
      - /var/run/docker.sock:/var/run/docker.sock   # Docker 守护进程套接字
      - /usr/bin/docker:/usr/bin/docker              # Docker CLI 二进制

    environment:
      - JAVA_OPTS=-Xmx2048m -Djenkins.install.runSetupWizard=false
      - TZ=Asia/Shanghai                             # 时区
