# ============================================================
# SRE 运维学习平台 — Nginx 反向代理配置（Linux）
#
# 用途：将 Jenkins 和 SRE 应用暴露到公网，并配置 HTTPS
#
# 安装位置:
#   Ubuntu/Debian: /etc/nginx/sites-available/sre-platform
#     → 启用: sudo ln -s /etc/nginx/sites-available/sre-platform /etc/nginx/sites-enabled/
#   CentOS/Rocky:  /etc/nginx/conf.d/sre-platform.conf
#
# 前置条件:
#   - 域名已解析到服务器 IP
#   - SSL 证书已配置（推荐 certbot 自动获取）
# ============================================================

# ---- Jenkins 后端服务器 ----
# upstream 定义服务器组，nginx 将请求分发到组内成员
upstream jenkins {
    server 127.0.0.1:8080;
}

# ---- 应用后端服务器 ----
upstream sre_app {
    server 127.0.0.1:3000;
}

# ============================================================
# Jenkins — HTTP (301 跳转到 HTTPS)
# ============================================================
server {
    listen 80;
    server_name jenkins.your.com;           # ← 替换为你的 Jenkins 域名

    # 301 永久重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================
# Jenkins — HTTPS
# ============================================================
server {
    listen 443 ssl http2;
    server_name jenkins.your.com;           # ← 替换为你的 Jenkins 域名

    # ---- SSL 证书路径（certbot 自动配置） ----
    ssl_certificate     /etc/letsencrypt/live/jenkins.your.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.your.com/privkey.pem;

    # ---- SSL 安全配置 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 通用请求头（转发到后端） ----
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Jenkins 反向代理 ----
    location / {
        proxy_pass http://jenkins;

        # WebSocket 支持（Jenkins 实时日志和终端）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（长任务不超时）
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://jenkins;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
# SRE 应用 — HTTP (301 跳转到 HTTPS)
# ============================================================
server {
    listen 80;
    server_name sre.your.com;               # ← 替换为你的应用域名

    return 301 https://$server_name$request_uri;
}

# ============================================================
# SRE 应用 — HTTPS
# ============================================================
server {
    listen 443 ssl http2;
    server_name sre.your.com;               # ← 替换为你的应用域名

    ssl_certificate     /etc/letsencrypt/live/sre.your.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sre.your.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 应用反向代理 ----
    location / {
        proxy_pass http://sre_app;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;

        # 禁用缓存（应用页面需要实时更新）
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- API 代理 ----
    location /api/ {
        proxy_pass http://sre_app;
        proxy_read_timeout 30s;

        # CORS 头（如需要跨域）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # ---- 上传文件缓存 ----
    location /uploads/ {
        proxy_pass http://sre_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
